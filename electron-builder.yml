appId: com.newline.app
productName: Newline

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - '!**/*.map'
  # node-llama-cpp ships prebuilt llama.cpp binaries for every platform; keep
  # only the target's.
  - '!node_modules/node-llama-cpp/bins/**/*'
  - 'node_modules/node-llama-cpp/bins/${os}-${arch}*/**/*'
  - '!node_modules/node-llama-cpp/llama/localBuilds/**/*'
  - 'node_modules/node-llama-cpp/llama/localBuilds/${os}-${arch}*/**/*'
  - '!node_modules/@node-llama-cpp/*/bins/**/*'
  - 'node_modules/@node-llama-cpp/${os}-${arch}*/bins/**/*'

# Native add-ons and libraries cannot be loaded from inside the asar archive.
asarUnpack:
  - out/native/*.node
  - node_modules/node-llama-cpp/bins
  - node_modules/node-llama-cpp/llama/localBuilds
  - node_modules/@node-llama-cpp/*

mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: ${name}-${version}-${arch}.${ext}
  # The sidebar-glass add-on is built universal already (scripts/build-native.mjs),
  # so the x64 and arm64 apps carry the same file and it is taken as it is.
  x64ArchFiles: '**/out/native/*.node'
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

publish:
  provider: github
