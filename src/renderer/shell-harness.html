<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newline shell harness</title>
    <!-- The same first-paint theme class index.html sets; see it for why. -->
    <script>
      try {
        var choice = localStorage.getItem('theme')
        var dark =
          choice === 'dark' ||
          ((!choice || choice === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {
        /* Private mode can throw on localStorage; the light default stands. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/shell-harness.tsx"></script>
  </body>
</html>
